{% set version = "1.5.0" %}

{% set posix = 'm2-' if win else '' %}

package:
  name: r-networktoolbox
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/NetworkToolbox_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/NetworkToolbox/NetworkToolbox_{{ version }}.tar.gz
  sha256: b5fe93700d9afcbd524701f24a2f869359cb39b6e44b187c68e0a3d612e6352c

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]

  host:
    - r-base
    - r-isingfit
    - r-mass
    - r-r.matlab
    - r-corrplot
    - r-doparallel
    - r-fdrtool
    - r-foreach
    - r-igraph
    - r-pbapply
    - r-ppcor
    - r-psych
    - r-pwr
    - r-qgraph

  run:
    - r-base
    - r-isingfit
    - r-mass
    - r-r.matlab
    - r-corrplot
    - r-doparallel
    - r-fdrtool
    - r-foreach
    - r-igraph
    - r-pbapply
    - r-ppcor
    - r-psych
    - r-pwr
    - r-qgraph

test:
  commands:
    - $R -e "library('NetworkToolbox')"           # [not win]
    - "\"%R%\" -e \"library('NetworkToolbox')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=NetworkToolbox
  license: GPL-3.0-or-later
  summary: Implements network analysis and graph theory measures used in neuroscience, cognitive science, and psychology. Methods include various filtering methods and approaches such as threshold, dependency (Kenett, Tumminello, Madi, Gur-Gershgoren, Mantegna, & Ben-Jacob, 2010 <doi:10.1371/journal.pone.0015032>), 
    Information Filtering Networks (Barfuss, Massara, Di Matteo, & Aste, 2016 <doi:10.1103/PhysRevE.94.062306>), and Efficiency-Cost Optimization (Fallani, Latora, & Chavez, 2017 <doi:10.1371/journal.pcbi.1005305>). Brain methods include the recently developed Connectome Predictive Modeling (see references in package).
    Also implements several network measures including local network characteristics (e.g., centrality), community-level network characteristics (e.g., community centrality), global network characteristics (e.g., clustering coefficient), and various other measures associated with the reliability and reproducibility of 
    network analysis.

  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'
extra:
  recipe-maintainers:
    - conda-forge/r
    - izahn
